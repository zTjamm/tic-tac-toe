<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Крестики-нолики</h1>

        <div class="scoreboard">
            <div class="score x-score">
                <span class="label">Игрок X</span>
                <span class="value" id="scoreX">0</span>
            </div>
            <div class="score draw-score">
                <span class="label">Ничьи</span>
                <span class="value" id="scoreDraw">0</span>
            </div>
            <div class="score o-score">
                <span class="label">Игрок O</span>
                <span class="value" id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">Ход игрока X</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button class="btn" id="resetBtn">Новая игра</button>
            <button class="btn" id="resetScoreBtn">Сбросить счёт</button>
        </div>

        <div class="mode-toggle">
            <span class="mode-label">Режим:</span>
            <button class="btn-mode active" data-mode="pvp">2 игрока</button>
            <button class="btn-mode" data-mode="bot">Против бота</button>
        </div>

        <div class="chat-container" id="chatContainer" style="display: none;">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." maxlength="100">
                <button class="btn-small" id="sendChatBtn">Отправить</button>
            </div>
        </div>
    </div>

    <div class="theme-toggle">
        <button id="themeToggleBtn" title="Переключить тему">🌙</button>
    </div>

    <div class="auth-modal" id="authModal">
        <div class="auth-container">
            <h2 id="authTitle">Вход</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            <form id="authForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" placeholder="Введите логин" minlength="3" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите 密码" minlength="4" required>
                </div>
                <div class="form-error" id="authError"></div>
                <button type="submit" class="btn btn-full" id="authSubmit">Войти</button>
            </form>
            <button class="auth-close" id="authClose">&times;</button>
        </div>
    </div>

    <div class="user-panel" id="userPanel" style="display: none;">
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <span class="user-rating" id="userRating"></span>
        </div>
        <div class="user-stats" id="userStats"></div>
        <button class="btn-small" id="profileBtn">Профиль</button>
        <button class="btn-small" id="logoutBtn">Выйти</button>
    </div>

    <div class="profile-modal" id="profileModal" style="display: none;">
        <div class="profile-container">
            <h2>Профиль</h2>
            <div class="profile-stats" id="profileStats"></div>
            <div class="profile-history" id="profileHistory"></div>
            <button class="btn" id="profileClose">Закрыть</button>
        </div>
    </div>

    <div class="leaderboard-modal" id="leaderboardModal" style="display: none;">
        <div class="leaderboard-container">
            <h2>Таблица лидеров</h2>
            <div class="leaderboard-list" id="leaderboardList"></div>
            <button class="btn" id="leaderboardClose">Закрыть</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
