<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="gameContainer" style="display: none;">
        <h1>Крестики-нолики</h1>

        <div class="scoreboard">
            <div class="score x-score">
                <span class="label" id="labelX">Игрок X</span>
                <span class="value" id="scoreX">0</span>
            </div>
            <div class="score draw-score">
                <span class="label">Ничьи</span>
                <span class="value" id="scoreDraw">0</span>
            </div>
            <div class="score o-score">
                <span class="label" id="labelO">Игрок O</span>
                <span class="value" id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">Ход игрока X</div>

        <div class="board" id="board" style="display: none;">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button class="btn" id="resetBtn">Новая игра</button>
            <button class="btn" id="resetScoreBtn">Сбросить счёт</button>
            <button class="btn" id="closeGameBtn" style="display: none;">Закрыть игру</button>
        </div>

        <div class="chat-container" id="chatContainer" style="display: none;">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." maxlength="100">
                <button class="btn-small" id="sendChatBtn">Отправить</button>
            </div>
        </div>
    </div>

    <div class="theme-toggle">
        <button class="btn-small" id="botGameBtn" title="Игра против бота">🤖</button>
        <button id="themeToggleBtn" title="Переключить тему">🌙</button>
        <button class="btn-small" id="profileBtn" title="Профиль" style="display: none;">👤</button>
        <button class="btn-small" id="logoutBtn" title="Выйти" style="display: none;">🚪</button>
    </div>

    <div class="auth-modal" id="authModal" style="display: flex;">
        <div class="auth-container">
            <h2 id="authTitle">Вход</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            <form id="authForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" placeholder="Введите логин" minlength="3" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите 密码" minlength="4" required>
                </div>
                <div class="form-error" id="authError"></div>
                <button type="submit" class="btn btn-full" id="authSubmit">Войти</button>
            </form>
            <button class="auth-close" id="authClose">&times;</button>
        </div>
    </div>

    <div class="profile-modal" id="profileModal" style="display: none;">
        <div class="profile-container">
            <h2>Профиль</h2>
            <div class="profile-stats" id="profileStats"></div>
            <div class="profile-history" id="profileHistory"></div>
            <button class="btn" id="profileClose">Закрыть</button>
        </div>
    </div>

    <div class="leaderboard-modal" id="leaderboardModal" style="display: none;">
        <div class="leaderboard-container">
            <h2>Таблица лидеров</h2>
            <div class="leaderboard-list" id="leaderboardList"></div>
            <button class="btn" id="leaderboardClose">Закрыть</button>
        </div>
    </div>

    <div class="friends-modal" id="friendsModal" style="display: none;">
        <div class="friends-container">
            <h2>Друзья</h2>
            <div class="friends-search">
                <input type="text" id="friendSearch" placeholder="Найти пользователя...">
            </div>
            <div class="friends-list" id="friendsList"></div>
            <button class="btn" id="friendsClose">Закрыть</button>
        </div>
    </div>

    <div class="challenge-modal" id="challengeModal" style="display: none;">
        <div class="challenge-container">
            <h2>Вызов на игру</h2>
            <p>Игрок <strong id="challengeFrom"></strong> вызывает вас!</p>
            <div class="challenge-buttons">
                <button class="btn btn-success" id="challengeAcceptBtn">Принять</button>
                <button class="btn btn-danger" id="challengeDeclineBtn">Отклонить</button>
            </div>
        </div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div class="side-tabs">
            <button class="side-tab active" data-tab="online">Онлайн</button>
            <button class="side-tab" data-tab="friends">Друзья</button>
            <button class="side-tab" data-tab="leaderboard">Рейтинг</button>
        </div>
        <div class="side-content">
            <div class="side-page active" id="page-online">
                <div class="online-layout">
                    <div class="online-left">
                        <div class="online-header">
                            <span>Онлайн: <strong id="onlineCount">0</strong></span>
                        </div>
                        <div class="online-list" id="onlineList"></div>
                    </div>
                    <div class="online-right">
                        <div class="global-chat-header">
                            <span>Общий чат</span>
                        </div>
                        <div class="global-chat-messages" id="globalChatMessages"></div>
                        <div class="global-chat-input">
                            <input type="text" id="globalChatInput" placeholder="Сообщение всем..." maxlength="200">
                            <button class="btn-small" id="globalChatSendBtn">➤</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="side-page" id="page-friends">
                <div class="friends-header">
                    <input type="text" id="friendSearchSide" placeholder="Найти пользователя...">
                </div>
                <div class="friends-list" id="friendsListSide"></div>
            </div>
            <div class="side-page" id="page-leaderboard">
                <div class="leaderboard-header">
                    <span>Таблица лидеров</span>
                </div>
                <div class="leaderboard-list" id="leaderboardListSide"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=44"></script>
</body>
</html>
