app = "tic-tac-toe-online"
primary_region = "warsaw"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Каталог с аккаунтами и рейтингами вынесен на том. Без него файловая
# система машины не переживает остановку при простое, и все, кто заходил
# раньше, после перезапуска оказались бы гостями.
#
# Том привязан к одной машине: приложение однопроцессное (cpus = 1), и при
# нескольких машинах они бы писали в один файл и портили его.
[mounts]
  source = "dots_data"
  destination = "/data"

[env]
  DATA_DIR = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
